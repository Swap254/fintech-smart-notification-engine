spring.application.name=risk-engine

# 1. PostgreSQL Database Connection Settings
spring.datasource.url=jdbc:postgresql://localhost:5432/fintech_risk_db
spring.datasource.username=postgres
spring.datasource.password=Novak@223

# 2. Hibernate / JPA Batching Performance Optimization
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
# Disable show-sql for large batches to avoid console text rendering bottlenecks
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Core Enterprise Batching Properties
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# 3. Server Configuration
server.port=8080

# 4. AWS Cloud Integration Mappings
spring.cloud.aws.region.static=ap-south-1
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID:}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY:}

# Custom Project Properties
aws.s3.bucket-name=swapnil-fintech-payloads-078127713461-ap-south-1-an
aws.sqs.queue-url=https://sqs.ap-south-1.amazonaws.com/078127713461/fintech-risk-alerts-queue

